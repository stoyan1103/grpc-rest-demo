syntax = "proto3";

package order.v1;

option java_multiple_files = true;
option java_package = "com.example.grpcdemo.contract.order.v1";
option java_outer_classname = "OrderRequestsProto";

import "order/v1/order_common.proto";

message CreateOrderGrpcRequest {
  string customer_name = 1;
  string address = 2;
  repeated OrderItemGrpc items = 3;
}

message GetOrderGrpcRequest {
  string order_id = 1;
}

message TrackOrderGrpcRequest {
  string order_id = 1;
}

message QuoteItemGrpcRequest {
  string product_id = 1;
  int32 quantity = 2;
  double weight = 3;
}

message DriverCommandGrpcRequest {
  string order_id = 1;
  DriverCommandType command = 2;
}
